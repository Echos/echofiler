# echofiler テーマ設定

[colors]
background = "default"
foreground = "white"

[file]
# ディレクトリ
directory = { fg = "blue", modifiers = ["bold"] }

# 実行ファイル
executable = { fg = "green", modifiers = ["bold"] }

# シンボリックリンク
symlink = { fg = "cyan" }

# 壊れたシンボリックリンク
broken_symlink = { fg = "red" }

# 隠しファイル
hidden = { fg = "gray" }

# アーカイブ (zip, tar, gz, 7z, rar等)
archive = { fg = "red" }

# 画像 (png, jpg, gif, webp等)
image = { fg = "magenta" }

# 動画 (mp4, mkv, avi, mov等)
video = { fg = "magenta", modifiers = ["bold"] }

# 音声 (mp3, wav, flac, ogg等)
audio = { fg = "cyan" }

# ドキュメント (pdf, doc, xls, ppt等)
document = { fg = "yellow" }

# ソースコード (rs, py, js, ts, c, go等)
source = { fg = "green" }

[ui]
# ボーダー
border = { fg = "gray" }

# アクティブペインのボーダー
border_focused = { fg = "blue" }

# カーソル
cursor = { bg = "blue", fg = "white" }

# 選択
selection = { bg = "yellow", fg = "black" }

# ステータスライン
statusline = { bg = "gray", fg = "white" }
