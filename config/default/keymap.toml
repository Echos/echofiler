# echofiler キーマップ設定

[normal]
# カーソル移動
"j" = "cursor_down"
"k" = "cursor_up"
"Down" = "cursor_down"
"Up" = "cursor_up"
"g g" = "cursor_top"
"G" = "cursor_bottom"
"H" = "cursor_page_up"
"L" = "cursor_page_down"

# ディレクトリ移動
"Enter" = "enter"
"Backspace" = "parent_dir"

# タブ操作
"[" = "prev_tab"
"]" = "next_tab"
"<C-t>" = "new_tab"
"<C-w>" = "close_tab"

# ペイン操作
"h" = "focus_left"
"l" = "focus_right"
"Left" = "focus_left"
"Right" = "focus_right"
"Tab" = "toggle_pane"
"<C-h>" = "focus_left"
"<C-l>" = "focus_right"

# 選択
"Space" = "toggle_select"
"v" = "visual_mode"
"V" = "visual_line"
"<C-a>" = "select_all"

# ファイル操作
"y y" = "yank"
"d d" = "cut"
"p" = "paste"
"P" = "paste_overwrite"
"D" = "delete"
"c" = "copy_to_other_pane"
"m" = "move_to_other_pane"
"r" = "rename"
"a" = "create"
"e" = "extract_archive"
"z" = "compress_to_zip"
"o" = "open_file"
"E" = "open_with_editor"
"w" = "open_with_pager"
"X" = "execute_file"

# 検索・フィルター
"/" = "search"
"f" = "filter"
"n" = "search_next"
"N" = "search_prev"

# ブックマーク（プレフィックスキー: g）
# 特殊ワード: <bm_prefix>
"g" = "<bm_prefix>"  # gキーでブックマークプレフィックスモードに入る
"<bm_prefix> a" = "add_bookmark"  # g b: ブックマーク追加
"<bm_prefix> B" = "show_bookmarks"  # g B: 全ブックマーク一覧
"<bm_prefix> m" = "show_bookmark_select"  # g m: キー付きブックマーク一覧
# <bm_prefix> + その他のキー: そのキーに登録されたブックマークへジャンプ（デフォルト動作）

# その他
":" = "command_mode"
"." = "toggle_hidden"
"q" = "quit"
"?" = "help"

[visual]
"Escape" = "normal_mode"
"y" = "yank_selection"
"d" = "cut_selection"
"D" = "delete_selection"

[command]
"Escape" = "normal_mode"
"Enter" = "execute_command"
"<C-c>" = "cancel"
